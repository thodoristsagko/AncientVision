<!DOCTYPE html>
<html>
<head>
    <title>Create Logo</title>
</head>
<body>
    <canvas id="canvas" width="180" height="180"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Background
        ctx.fillStyle = '#0D3A39';
        ctx.beginPath();
        ctx.roundRect(0, 0, 180, 180, 32);
        ctx.fill();
        
        // Circle
        const gradient = ctx.createLinearGradient(0, 0, 180, 180);
        gradient.addColorStop(0, '#FFC107');
        gradient.addColorStop(1, '#FF9800');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(90, 70, 35, 0, 2 * Math.PI);
        ctx.fill();
        
        // Text
        ctx.font = 'bold 20px Arial';
        ctx.fillStyle = gradient;
        ctx.textAlign = 'center';
        ctx.fillText('Ancient', 90, 140);
        ctx.fillText('Vision', 90, 160);
        
        // Download
        canvas.toBlob(function(blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'logo.png';
            document.body.appendChild(a);
            a.click();
        });
    </script>
</body>
</html>
